<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Coupled" />
    <meta name="application-name" content="Coupled" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fff3ec" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Coupled</title>
    <meta name="description" content="Daily puzzles you set for each other, and a game night for the two of you." />
    <!-- How a pasted link looks in a chat: the card, not a bare address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coupled" />
    <meta property="og:title" content="Coupled — games for the two of you" />
    <meta property="og:description" content="Daily puzzles you set for each other, and game nights that are head to head and together." />
    <meta property="og:url" content="https://johnnynero.github.io/couples-party/" />
    <meta property="og:image" content="https://johnnynero.github.io/couples-party/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Before first paint, so a night-mode phone never flashes cream on the way in.
      try {
        var t = localStorage.getItem('couples-party:theme')
        if (t === 'day' || t === 'night') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
